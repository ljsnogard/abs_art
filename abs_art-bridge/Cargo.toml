[package]
name = "abs_art-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
abs_art        = { path = "../abs_art", version = "0.3.0" }
abs_art-tokio  = { path = "../abs_art-tokio", optional = true, version = "0.3.0" }
abs_art-compio = { path = "../abs_art-compio", optional = true, version = "0.3.0" }
abs_art-smol   = { path = "../abs_art-smol", optional = true, version = "0.3.0" }

[features]
# 通过 Cargo.toml 选择后端（必须且只能启用一个）
backend-compio = ["dep:abs_art-compio"]
backend-tokio = ["dep:abs_art-tokio"]
backend-smol = ["dep:abs_art-smol"]

# 缺省后端 = tokio。
#
# 为什么缺省值必须与「workspace 里其它成员所用的后端」一致：`cargo test
# --workspace` 会把同一个 `abs_art-bridge` 的 feature **取并集**——一边是
# 它作为 workspace 成员被启用 default features，一边是 `abs_art-demo` 以
# `bridge_tokio`（backend-tokio）依赖它。若缺省值与 demo 的缺省演示组不同，
# 并集里就会同时出现两个 backend，触发下面的 `compile_error!`，整个
# `cargo test --workspace` 直接编译失败。
#
# 因此：改这里的缺省值，必须同时改 `abs_art-demo` 的缺省演示组（`demo-*`），
# 否则 workspace 级测试会红。反过来，只想用某一个后端时，正确写法始终是
# 显式指定：
#
#   abs_art-bridge = { ..., default-features = false, features = ["backend-smol"] }
default = ["backend-tokio"]
