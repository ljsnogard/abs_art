[package]
name = "abs_art-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
abs_art        = { path = "../abs_art", version = "0.3.0" }
abs_art-tokio  = { path = "../abs_art-tokio", optional = true, version = "0.3.0" }
abs_art-compio = { path = "../abs_art-compio", optional = true, version = "0.3.0" }
abs_art-smol   = { path = "../abs_art-smol", optional = true, version = "0.3.0" }

[features]
# 链接哪些后端（可以同时启用多个）。
backend-compio = ["dep:abs_art-compio"]
backend-tokio = ["dep:abs_art-tokio"]
backend-smol = ["dep:abs_art-smol"]

# 声明**默认**后端（裸名 Runtime / current 指向谁）。
#
# 只有启用**多个** backend 时才需要显式声明：`cargo test --workspace` 会把各成员的
# feature 取并集，若此时没有声明默认，裸名会按优先级悄悄选中一个——很可能是错的
# 那个（实测：应用明明要 smol，却因为并集里还有 tokio 而走了 tokio 路径，运行期
# panic）。因此本 crate 选择「多后端时必须显式声明，否则编译失败」。
default-backend-compio = ["backend-compio"]
default-backend-tokio = ["backend-tokio"]
default-backend-smol = ["backend-smol"]

# 缺省后端 = compio。
#
# 写法是 `default-backend-compio` 而不是裸的 `backend-compio`：这样「默认是谁」是
# **显式声明**的，于是 `cargo test --workspace` 把 bridge 的缺省 feature 与下游
# （如 `abs_art-demo` 的 `bridge_tokio`）所用的后端取并集时，裸名仍有唯一解；
# 若只写裸 `backend-compio`，并集里出现两个后端就会触发下面的守卫而编译失败。
default = ["default-backend-compio"]

# 仅测试用：桥接 crate 的烟雾测试需要真实运行时来驱动各后端。
# 三个测试模块各自用**具名别名**（TokioRuntime / CompioRuntime / SmolRuntime），
# 因此互不干扰、也不受 bridge 缺省后端的影响。
[dev-dependencies]
compio = { workspace = true }
smol = { workspace = true }
tokio = { workspace = true }
