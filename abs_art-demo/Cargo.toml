[package]
name = "abs_art-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# ---------------------------------------------------------------
# 演示组选择：demo-tokio（默认）与 demo-compio **互斥**，一次构建只能启用一个。
#
#   cargo run  -p abs_art-demo                                            # tokio 组（默认）
#   cargo run  -p abs_art-demo --no-default-features --features demo-compio  # compio 组
#
# 两个 feature 同时启用会触发 src/lib.rs 里的 compile_error（响亮报错）。
# ---------------------------------------------------------------
[features]
default = ["demo-tokio"]
demo-tokio  = ["dep:bridge_tokio", "dep:tokio"]
demo-compio = ["dep:bridge_compio", "dep:compio"]

[dependencies]
# 同一个 abs_art-bridge 以两个不同的 backend 实例化（重命名依赖，均 optional）：
# - bridge_tokio  → backend-tokio
# - bridge_compio → backend-compio
# 由上面的 demo-* feature 二选一启用，保证任何一次构建里 bridge 恰好只启用
# 一个 backend（bridge 内部对「零个 / 多个 backend」都有 compile_error 检查）。
# 业务代码（src/lib.rs + examples）通过这两个名字访问「当前后端」的 bridge。
bridge_tokio  = { package = "abs_art-bridge", path = "../abs_art-bridge", version = "0.2.1", default-features = false, features = ["backend-tokio"],  optional = true }
bridge_compio = { package = "abs_art-bridge", path = "../abs_art-bridge", version = "0.2.1", default-features = false, features = ["backend-compio"], optional = true }

# 直接依赖：只用于「创建运行时」的集成方代码（src/main.rs / tests / examples 的 main）。
# 业务函数本身不感知它们。
tokio  = { workspace = true, optional = true }
compio = { workspace = true, optional = true }

# ---------------------------------------------------------------
# examples：examples/ 下的子目录不参与 Cargo 自动发现，这里显式声明全部
# 14 个示例（tokio_demo / compio_demo 各 7 个），并用 required-features
# 让「不属于当前演示组的示例」自动跳过编译。
# ---------------------------------------------------------------
[[example]]
name = "tokio_cap_block_on"
path = "examples/tokio_demo/cap_block_on.rs"
required-features = ["demo-tokio"]

[[example]]
name = "tokio_cap_spawn_send"
path = "examples/tokio_demo/cap_spawn_send.rs"
required-features = ["demo-tokio"]

[[example]]
name = "tokio_cap_spawn_local"
path = "examples/tokio_demo/cap_spawn_local.rs"
required-features = ["demo-tokio"]

[[example]]
name = "tokio_cap_delay"
path = "examples/tokio_demo/cap_delay.rs"
required-features = ["demo-tokio"]

[[example]]
name = "tokio_cap_spawn_blocking"
path = "examples/tokio_demo/cap_spawn_blocking.rs"
required-features = ["demo-tokio"]

[[example]]
name = "tokio_cap_full"
path = "examples/tokio_demo/cap_full.rs"
required-features = ["demo-tokio"]

[[example]]
name = "tokio_cap_zero"
path = "examples/tokio_demo/cap_zero.rs"
required-features = ["demo-tokio"]

[[example]]
name = "compio_cap_block_on"
path = "examples/compio_demo/cap_block_on.rs"
required-features = ["demo-compio"]

[[example]]
name = "compio_cap_spawn_send"
path = "examples/compio_demo/cap_spawn_send.rs"
required-features = ["demo-compio"]

[[example]]
name = "compio_cap_spawn_local"
path = "examples/compio_demo/cap_spawn_local.rs"
required-features = ["demo-compio"]

[[example]]
name = "compio_cap_delay"
path = "examples/compio_demo/cap_delay.rs"
required-features = ["demo-compio"]

[[example]]
name = "compio_cap_spawn_blocking"
path = "examples/compio_demo/cap_spawn_blocking.rs"
required-features = ["demo-compio"]

[[example]]
name = "compio_cap_full"
path = "examples/compio_demo/cap_full.rs"
required-features = ["demo-compio"]

[[example]]
name = "compio_cap_zero"
path = "examples/compio_demo/cap_zero.rs"
required-features = ["demo-compio"]
