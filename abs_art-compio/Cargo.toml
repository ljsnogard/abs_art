[package]
name = "abs_art-compio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
abs_art-mock_clock = { workspace = true, optional = true }
abs_art = { path = "../abs_art", version = "0.3.0" }
compio = { workspace = true }

[features]
default = ["block_on", "delay", "spawn_send", "local_scope", "spawn_blocking"]

# 五个功能开关：按需启用，互不影响
block_on = []
delay = ["join_handle"]
# 本后端**不**提供「投递到跨线程全局队列」的能力：compio 的执行器是线程本地的。
# 打开本 feature 只会带来一篇说明「为什么没有 `impl TrSpawnSend`」的文档模块
# （含 compile_fail 文档测试），投递任务请用 local_scope 的 `spawn_local`。
spawn_send = ["join_handle"]
# 线程独占的本地作用域（`!Send` 任务 + 投递与统一驱动入口），由
# `Runtime::<CAPS>::local_scope()` 交出（要求 CAPS 含 `SPAWN_LOCAL`）。
local_scope = ["join_handle"]
spawn_blocking = ["join_handle"]

# 手动（虚拟）时钟驱动：接上独立的 `abs_art-mock_clock` crate。
# 提供 `LocalScope::block_on_advancing`：本地队列照常被驱动，而「时间」由测试自己推进。
mock-clock = ["dep:abs_art-mock_clock", "local_scope"]

# 内部支持 feature：`JoinHandle` / `JoinError` 包装，被 `delay` 与 `spawn_*` 隐式启用
join_handle = []
