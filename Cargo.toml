[workspace]
members = [
    "abs_art",
    "abs_art-tokio",
    "abs_art-compio",
    "abs_art-smol",
    "abs_art-bridge",
    "abs_art-smoke",
    "abs_art-mock_clock",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["lino <lino_snsalias@outlook.com>"]
license = "MIT/Apache-2.0"
description = "ABStraction of Asynchronous RunTime"
homepage = "https://github.com/ljsnogard/abs_art"
keywords = ["async", "async-runtime", "wrapper"]
categories = ["asynchronous"]
readme = "README.md"

[workspace.dependencies]
abs_art = { path = "abs_art" }
abs_art-tokio = { path = "abs_art-tokio" }
abs_art-compio = { path = "abs_art-compio" }
abs_art-smol = { path = "abs_art-smol" }
abs_art-bridge = { path = "abs_art-bridge" }
abs_art-mock_clock = { path = "abs_art-mock_clock" }
# 自旋锁：不重复发明，直接用同仓库的 atomic_sync（no_std，见 src/mutex/preemptive.rs）
atomic_sync = { git = "https://gitee.com/lino_snsalias/atomic_sync.git", branch = "dev/0.3.0" }
# 与运行时无关的消息通道：abs_art-smoke 的循环任务用例使用
async-channel = { version = "2" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
compio = { version = "0.19.*", features = ["time"] }
smol = { version = "2" }
